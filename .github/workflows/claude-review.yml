name: Claude AI Peer Review (Moodle 5.2)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [dev]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: claude-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  claude-code-review:
    name: Claude AI Peer Review (Moodle 5.2)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: "--max-turns 3"
          show_full_output: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Você é um Moodle Core Peer Reviewer validando um Pull Request para o **Moodle 5.2**.
            Siga as diretrizes de desenvolvimento oficiais do Moodle (https://moodledev.io/general/development/process/peer-review):

            1. **Segurança (Moodle Security Guidelines)**:
               - Verifique uso rigoroso de `$DB->get_records()` e sanitização SQL.
               - Verifique chamadas a `required_param()` e `optional_param()` com o PARAM_* correto.
               - Verifique permissões via `require_capability()`.
               - Prevenção de XSS e uso correto de `format_text()`, `format_string()`, e `s()`.

            2. **Arquitetura & Compatibilidade Moodle 5.2**:
               - Compatibilidade estrita com PHP 8.3 e PHP 8.4 (evite código depreciado).
               - Uso correto de Hooks da API de plugins do Moodle (evite eventos legados obsoletos).
               - Conformidade com a Moodle DB API.

            3. **Acessibilidade e Frontend**:
               - Padrões de renderização via Mustache templates e Renderers.
               - Conformidade com Moodle Design System / Bootstrap.

            Forneça comentários diretamente nas linhas com problemas identificados e resuma a avaliação final com status de aprovação ou solicitações de alteração.

            Use `gh pr comment` para feedback geral.
            Use `mcp__github_inline_comment__create_inline_comment` (com `confirmed: true`) para destacar problemas específicos no código.
            Só poste comentários no GitHub - não submeta texto de revisão como mensagens.