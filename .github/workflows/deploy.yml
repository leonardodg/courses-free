name: CI/CD - courses.leodg.dev

# =============================================================================
# Ambiente unico (development) na VPS Oracle. Sem GCP, sem AWS.
#
#   pull_request        -> so valida
#   push em dev ou main -> valida, publica a imagem e faz deploy
#
# dev deploya porque o ambiente e um so. Exigir um PR dev->main a cada mudanca
# so acrescentava um clique entre o merge e a VPS, sem separar nada: os dois
# branches iam para a mesma maquina, com a mesma tag de imagem.
#
# -----------------------------------------------------------------------------
# BOOTSTRAP: automatico. O job de deploy detecta se a tabela mdl_config existe;
# se nao existir roda install_database.php com o secret MOODLE_ADMIN_PASS, e nos
# deploys seguintes roda so o upgrade.
#
# Secrets e variables vivem no ENVIRONMENT "development", nao no repositorio.
# Por isso todo job que le vars.*/secrets.* declara `environment: development`.
# =============================================================================

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  # Um deploy por vez: dois rodando juntos corrompem o upgrade.php.
  #
  # Duas exigencias opostas, resolvidas por evento:
  #
  # PULL REQUEST - grupo POR REF. Com uma string fixa, uma validacao de PR
  #   entraria na mesma fila do deploy e, como cancel-in-progress e false ali,
  #   seguraria o deploy em "pending" ate terminar. Foi o que travou o primeiro
  #   deploy deste repositorio.
  #
  # PUSH - grupo FIXO. Desde que dev e main deployam, um grupo por ref deixaria
  #   os dois rodarem em paralelo na MESMA VPS, com a mesma tag de imagem e o
  #   mesmo banco. Dois upgrade.php concorrentes e exatamente o que esta linha
  #   existe para impedir.
  group: deploy-courses-free-${{ github.event_name == 'pull_request' && github.ref || 'vps' }}
  # Em PR pode cancelar a execucao anterior; no main nunca, para nao
  # interromper um upgrade.php no meio.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# IMAGE NAO pode ser definido aqui: vars.* do environment "development" nao sao
# visiveis no nivel do workflow, e sairia "/courses-free:development".
# Cada job que precisa dele declara environment + env proprio.

jobs:
  # ===========================================================================
  validate:
    name: Validar plugins proprios
    runs-on: ubuntu-latest

    # moodle-plugin-ci instala um Moodle de verdade para rodar os testes,
    # entao precisa de um banco no runner.
    #
    # MariaDB, e nao Postgres, porque a VPS roda MariaDB. Testar num motor
    # diferente do de producao deixa passar exatamente o que so aparece em
    # producao: diferenca de collation, de tipo de coluna, de comportamento em
    # ordenacao. A versao acompanha a do compose.
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'true'
          MARIADB_CHARACTER_SET_SERVER: utf8mb4
          # utf8mb4_bin e exigencia do Moodle, e e a mesma da VPS.
          MARIADB_COLLATION_SERVER: utf8mb4_bin
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          path: plugins-src

      - name: Ler .github/moodle-plugins.txt
        id: plugins
        working-directory: plugins-src
        run: |
          # Ignora comentarios e linhas vazias.
          LIST=$(grep -vE '^\s*(#|$)' .github/moodle-plugins.txt || true)
          if [ -z "$LIST" ]; then
            echo "Nenhum plugin proprio listado ainda - nada a validar."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "$LIST"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "list<<EOF" >> "$GITHUB_OUTPUT"
            echo "$LIST" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Conferir que cada path listado existe e tem version.php
        if: steps.plugins.outputs.found == 'true'
        working-directory: plugins-src
        run: |
          FAIL=0
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            if [ ! -f "$p/version.php" ]; then
              echo "::error::$p nao tem version.php"
              FAIL=1
            fi
          done <<< "${{ steps.plugins.outputs.list }}"
          exit $FAIL

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, mysqli, gd, zip, intl, soap, xmlrpc
          ini-values: max_input_vars=5000
          coverage: none

      # Plugins de terceiros: SO phplint.
      #
      # Sao 800+ arquivos de upstream. Um phpcs com --max-warnings 0 acusaria
      # centenas de violacoes que nao podemos corrigir, e como este job bloqueia
      # o deploy, travaria os deploys para sempre por problema que nao e nosso.
      #
      # O que phplint pega e o risco real de manter plugin de terceiro: subir a
      # versao do PHP e so descobrir em producao que um deles usa sintaxe
      # removida. Roda antes do resto porque e barato e falha rapido.
      - name: Conferir que os plugins de terceiros parseiam no PHP do projeto
        working-directory: plugins-src
        run: |
          set -euo pipefail
          LIST=$(grep -vE '^\s*(#|$)' .github/moodle-plugins-thirdparty.txt || true)
          if [ -z "$LIST" ]; then
            echo "Nenhum plugin de terceiro listado."
            exit 0
          fi

          FAIL=0
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            if [ ! -d "$p" ]; then
              echo "::error::$p nao existe"
              FAIL=1
              continue
            fi
            N=$(find "$p" -name '*.php' | wc -l)
            echo "::group::$p ($N arquivos)"
            # -print0/-0 aguenta caminho com espaco; -P usa os nucleos do runner.
            if ! find "$p" -name '*.php' -print0 \
                 | xargs -0 -P 4 -n 20 php -l > /tmp/lint.out 2>&1; then
              grep -v '^No syntax errors' /tmp/lint.out | head -20
              echo "::error::$p tem erro de sintaxe no PHP $(php -r 'echo PHP_VERSION;')"
              FAIL=1
            else
              echo "ok"
            fi
            echo "::endgroup::"
          done <<< "$LIST"
          exit $FAIL

      # O PHPUnit do Moodle exige en_AU.UTF-8 e aborta sem ele, com
      # "Required locale 'en_AU.UTF-8' is not installed" - antes de rodar teste
      # nenhum. O runner do GitHub nao traz esse locale.
      - name: Instalar o locale que o PHPUnit do Moodle exige
        if: steps.plugins.outputs.found == 'true'
        run: |
          sudo locale-gen en_AU.UTF-8
          sudo update-locale

      - name: moodle-plugin-ci
        if: steps.plugins.outputs.found == 'true'
        env:
          # Tem que acompanhar a branch do repo.
          MOODLE_BRANCH: MOODLE_502_STABLE
          # Acompanha o servico acima e o motor da VPS.
          DB: mariadb
        run: |
          set -euo pipefail
          composer create-project -n --no-dev --prefer-dist \
            moodlehq/moodle-plugin-ci /tmp/ci ^4
          export PATH="/tmp/ci/bin:/tmp/ci/vendor/bin:$PATH"

          # Quatro dos cinco plugins dependem do local_marketplace: o enrol e o
          # availability usam as classes dele, e o block declara a dependencia.
          # Instalar um sozinho num Moodle limpo faria o phpunit falhar por
          # classe inexistente - falha do arranjo, nao do codigo.
          #
          # Por isso cada rodada leva os OUTROS plugins da lista em
          # --extra-plugins, que espera um diretorio plano com um plugin por
          # subpasta, nomeada com o nome do componente.
          LIST='${{ steps.plugins.outputs.list }}'

          i=0
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            i=$((i+1))
            echo "::group::$p"

            # Monta o diretorio de dependencias, sem o plugin sob teste.
            EXTRA="/tmp/extra-$i"
            rm -rf "$EXTRA" && mkdir -p "$EXTRA"
            while IFS= read -r dep; do
              [ -z "$dep" ] && continue
              [ "$dep" = "$p" ] && continue
              cp -a "$GITHUB_WORKSPACE/plugins-src/$dep" "$EXTRA/$(basename "$dep")"
            done <<< "$LIST"

            # Um banco POR plugin. O install nao derruba o banco anterior, e a
            # segunda rodada morria com 'database "moodle" already exists'.
            rm -rf "/tmp/moodle-$i"
            moodle-plugin-ci install \
              --plugin "$GITHUB_WORKSPACE/plugins-src/$p" \
              --extra-plugins "$EXTRA" \
              --db-host 127.0.0.1 \
              --db-name "moodle_ci_$i" \
              --moodle "/tmp/moodle-$i"
            moodle-plugin-ci phplint
            moodle-plugin-ci phpcs --max-warnings 0
            moodle-plugin-ci phpunit
            echo "::endgroup::"
          done <<< "$LIST"

  # ===========================================================================
  # Roda os testes dos plugins de TERCEIROS no Moodle 5.2.
  #
  # NAO bloqueia o deploy, e nao e por preguica: se travasse, um teste quebrado
  # no upstream deixaria a plataforma sem poder subir codigo nosso - e nao temos
  # como corrigir o codigo deles. O valor aqui e saber, nao impedir.
  #
  # A pergunta que este job responde: customcert e moove nao declaram
  # $plugin->supported, entao ninguem sabe se funcionam no 5.2. Rodar os testes
  # deles e a unica forma de descobrir sem esperar quebrar em producao.
  thirdparty:
    name: Testar plugins de terceiros (informativo)
    runs-on: ubuntu-latest
    continue-on-error: true

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'true'
          MARIADB_CHARACTER_SET_SERVER: utf8mb4
          MARIADB_COLLATION_SERVER: utf8mb4_bin
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          path: plugins-src

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, mysqli, gd, zip, intl, soap, xmlrpc
          ini-values: max_input_vars=5000
          coverage: none

      - name: Instalar o locale que o PHPUnit do Moodle exige
        run: |
          sudo locale-gen en_AU.UTF-8
          sudo update-locale

      - name: phpunit nos plugins sem suporte declarado
        env:
          MOODLE_BRANCH: MOODLE_502_STABLE
          DB: mariadb
        run: |
          set -uo pipefail
          composer create-project -n --no-dev --prefer-dist \
            moodlehq/moodle-plugin-ci /tmp/ci ^4
          export PATH="/tmp/ci/bin:/tmp/ci/vendor/bin:$PATH"

          # So os que NAO declaram supported. Quem declara e cobre o 5.2 ja
          # respondeu a pergunta; rodar tudo custaria minutos sem informacao
          # nova.
          RESUMO=""
          i=0
          for p in public/mod/customcert public/theme/moove; do
            i=$((i+1))
            echo "::group::$p"
            rm -rf "/tmp/tp-$i"
            if moodle-plugin-ci install \
                 --plugin "$GITHUB_WORKSPACE/plugins-src/$p" \
                 --db-host 127.0.0.1 \
                 --db-name "moodle_tp_$i" \
                 --moodle "/tmp/tp-$i" \
               && moodle-plugin-ci phpunit; then
              RESUMO="$RESUMO\n  OK      $p"
            else
              RESUMO="$RESUMO\n  FALHOU  $p"
            fi
            echo "::endgroup::"
          done

          echo "### Plugins de terceiros no Moodle 5.2" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          printf "%b\n" "$RESUMO" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          printf "%b\n" "$RESUMO"

  # ===========================================================================
  image:
    name: Build e push da imagem (arm64)
    needs: validate
    if: github.event_name != 'pull_request'
    # A VPS Oracle e aarch64 (Ampere). Buildar na ubuntu-latest, que e x86_64,
    # geraria uma imagem que nao roda la. Runner ARM nativo evita a emulacao
    # QEMU, que num build de Moodle custa dezenas de minutos.
    # Gratuito porque o repositorio e publico.
    runs-on: ubuntu-24.04-arm
    # Obrigatorio: DOCKER_USERNAME e DOCKER_TOKEN vivem no environment.
    environment: development
    env:
      IMAGE: ${{ vars.DOCKER_USERNAME }}/courses-free:development
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/build/moodle.Dockerfile
          target: development
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}
            ${{ vars.DOCKER_USERNAME }}/courses-free:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}
          cache-to: type=inline
          build-args: |
            ENVIRONMENT=development
            TZ=America/Sao_Paulo

  # ===========================================================================
  deploy:
    name: Deploy na VPS Oracle
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: development
    env:
      IMAGE: ${{ vars.DOCKER_USERNAME }}/courses-free:development
    steps:
      - uses: actions/checkout@v4

      # O dev.yml monta o repo do host em /var/www/html, entao o codigo precisa
      # estar no filesystem da VPS - nao basta a imagem.
      - name: Enviar o codigo
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
          SOURCE: "./"
          TARGET: ${{ vars.VPS_PATH }}/repo
          # --delete para arquivo removido no git sumir la tambem.
          # Os excludes protegem o que e gerado/local NA VPS.
          ARGS: "-rlgoDzvc --delete"
          # A BARRA INICIAL E OBRIGATORIA em /.env e /config.php.
          # Sem ela o rsync casa o nome em QUALQUER nivel da arvore: "config.php"
          # excluiria public/cache/classes/config.php, public/theme/boost/config.php
          # e outros 6 arquivos do proprio Moodle, e a instalacao morre com
          # 'Class "core_cache\config" not found'.
          EXCLUDE: ".git/, .github/, node_modules/, .devcontainer/secrets/, .devcontainer/certs/, /.env, /config.php, /config-local.php"

      - name: Configurar e subir
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          envs: IMAGE
          script: |
            set -euo pipefail
            cd "${{ vars.VPS_PATH }}/repo"

            mkdir -p .devcontainer/secrets .devcontainer/certs
            mkdir -p "${{ vars.VPS_PATH }}/moodledata" "${{ vars.VPS_PATH }}/dbdata"

            # --- secrets (0600, nunca versionados) ---
            umask 077
            printf '%s' '${{ secrets.MOODLE_DBUSER }}' > .devcontainer/secrets/db_user
            printf '%s' '${{ secrets.MOODLE_DBPASS }}' > .devcontainer/secrets/db_password
            printf '%s' '${{ secrets.MOODLE_DBROOT }}' > .devcontainer/secrets/db_root_password
            umask 022

            # --- env do container ---
            cat > .devcontainer/env/db.env <<EOF
            MARIADB_DATABASE=${{ vars.MOODLE_DBNAME }}
            EOF

            cat > .devcontainer/env/dev.env <<EOF
            MOODLE_DOCKER_WWWROOT=/var/www/html
            APACHE_DOCUMENT_ROOT=/var/www/html/public
            MOODLE_DATA=/var/www/moodledata
            MOODLE_ADMIN=admin
            MOODLE_DBTYPE=mariadb
            MOODLE_DBLIB=native
            MOODLE_DBHOST=db
            MOODLE_DBNAME=${{ vars.MOODLE_DBNAME }}
            MOODLE_DBPFX=mdl_
            MOODLE_DBCOLLATION=utf8mb4_bin
            MOODLE_URL=${{ vars.MOODLE_URL }}
            MOODLE_DEBUG=DEVELOPER
            # Independente do debug. Desligar faz o Moodle servir cada modulo
            # AMD numa requisicao, e o botao de comprar passa a exigir dois
            # cliques enquanto o modal de pagamento termina de carregar.
            MOODLE_CACHEJS=true
            MOODLE_DEBUG_DISPLAY=0
            PHP_OPCACHE_VALIDATE_TIMESTAMPS=1
            CRON_ENABLED=true
            EOF

            # --- interpolacao do compose (bind mounts e portas) ---
            cat > .env <<EOF
            MOODLE_HOST_WWWROOT=${{ vars.VPS_PATH }}/repo
            MOODLE_HOST_DATA=${{ vars.VPS_PATH }}/moodledata
            DB_HOST_DATA=${{ vars.VPS_PATH }}/dbdata
            MOODLE_DOCKER_WWWROOT=/var/www/html
            MOODLE_DOCKER_DATA=/var/www/moodledata
            APACHE_DOCUMENT_ROOT=/var/www/html/public
            MOODLE_IMAGE=${IMAGE}
            # 8080/8081/8082 ja estao ocupadas nesta VPS por outros servicos.
            MOODLE_HTTP_PORT=8095
            # Sem MOODLE_HTTPS_PORT: a 443 do container so e publicada por
            # local-tls.yml, que nao entra no COMPOSE_FILE da VPS.
            DB_PORT=3307
            XDEBUG_PORT=9004
            # Interface do Apache (8095) e do Xdebug (9004). FIXO em 127.0.0.1:
            # o nginx da VPS e quem fala com o container, e publicar a porta
            # alta em outra interface contorna o proxy e o TLS. O Xdebug entao
            # e execucao remota de codigo para quem alcancar a porta.
            BIND_ADDR=127.0.0.1
            # Interface do banco. Variavel separada de proposito - ver o
            # comentario em .devcontainer/compose/db.yml.
            #
            # Padrao 127.0.0.1: so quem esta na VPS alcanca. Para acesso pela
            # VPN, defina a variable DB_BIND_ADDR no environment com o IP da
            # interface do WireGuard: o banco fica visivel na VPN e invisivel
            # no IP publico, sem depender de firewall de borda.
            #
            # 0.0.0.0 aqui publica o MariaDB em todas as interfaces, a publica
            # inclusive, e o db.yml define MARIADB_ROOT_HOST="%".
            DB_BIND_ADDR=${{ vars.DB_BIND_ADDR != '' && vars.DB_BIND_ADDR || '127.0.0.1' }}
            MOODLE_DBNAME=${{ vars.MOODLE_DBNAME }}
            EOF

            # O bind mount esconde o config.php da imagem: ele tem que existir aqui.
            # O config.php e GERADO a cada deploy, e nao preservado.
            #
            # Preservar parecia prudente - protegia ajuste feito direto na
            # maquina - mas o efeito era que mudanca no template nunca chegava
            # sozinha. Uma correcao de cachejs ficou semanas sem efeito, e
            # recria-lo a mao derrubou o site em 2026-08-25.
            #
            # Ajuste especifico da maquina vai em config-local.php, que o
            # proprio template inclui se existir e que esta no EXCLUDE do rsync.
            # O deploy nunca toca nele.
            # Escreve ao lado e move: rename() e atomico no mesmo sistema de
            # arquivos. Um cp interrompido deixaria o config.php pela metade, e
            # config.php truncado derruba o site inteiro - nao uma pagina.
            cp .devcontainer/config/config-docker.php config.php.novo
            mv -f config.php.novo config.php
            echo ">> config.php gerado do template"

            if [ -f config-local.php ]; then
              echo ">> config-local.php encontrado - ajustes locais preservados"
            fi

            # Nao ha certificado a gerar aqui: quem termina TLS e o nginx, com
            # o certificado do certbot para courses.leodg.dev. O container so
            # serve HTTP, e o compose da VPS nao inclui local-tls.yml.

            # Nao ha certificado a gerar aqui: quem termina TLS e o nginx, com
            # o certificado do certbot para courses.leodg.dev. O container so
            # serve HTTP, e o compose da VPS nao inclui local-tls.yml.

            # --- subir ---
            # build-dev.yml NAO entra: na VPS a imagem vem do Docker Hub.
            export COMPOSE_FILE=.devcontainer/compose/base.yml:.devcontainer/compose/db.yml:.devcontainer/compose/dev.yml
            export COMPOSE_ENV_FILE=.env

            # -x para o log mostrar QUAL comando falhou. Sem isso o script sai
            # em silencio e so da para adivinhar.
            set -x

            # --- espaco em disco ---
            #
            # NAO limpe imagens daqui. Esta VPS hospeda outros servicos, e
            # "docker image prune -a" apaga a imagem de qualquer container que
            # esteja parado no momento - inclusive de projetos que nao sao
            # deste repositorio. Imagem buildada localmente, sem registry, nao
            # volta.
            #
            # A limpeza e manual, feita por quem sabe o que mais roda aqui.
            #
            # O log abaixo existe porque a falha por disco cheio engana duas
            # vezes: nao diz "disco cheio" de cara - aparece como "no space
            # left on device" no meio de um caminho de arquivo qualquer, dentro
            # da extracao da imagem - e o site continua NO AR com o container
            # antigo, entao "o site responde" nao prova que o deploy aplicou.
            # Em 2026-08-25 o job falhou e courses.leodg.dev seguia em 200,
            # servindo a versao anterior.
            echo ">> espaco em disco:"
            df -h / | tail -1

            docker compose pull
            # --wait ja espera os healthchecks; dispensa loop manual de espera.
            docker compose up -d --remove-orphans --wait

            # OBRIGATORIO depois de reescrever os secrets acima.
            #
            # O entrypoint le /run/secrets/* como root e EXPORTA como variavel
            # de ambiente antes de entregar o controle ao Apache - necessario,
            # porque www-data nao consegue ler arquivo 600 do uid do host.
            # O efeito colateral e que a credencial e lida UMA VEZ, no boot.
            #
            # "up -d" so recria o container quando a imagem ou a config mudam.
            # Num deploy que nao muda nenhum dos dois, uma senha rotacionada
            # ficaria sem efeito e o site responderia 500 com "Access denied" -
            # exatamente o que aconteceu em 2026-08-25.
            #
            # O restart e barato e idempotente; deixar de fazer nao e.
            docker compose restart moodle
            docker compose ps

            # A espera por saude e feita pelo --wait do "up" acima.
            # O loop manual que existia aqui usava "ps db | grep -q healthy":
            # com pipefail, o grep -q fecha o pipe no primeiro casamento e o
            # ps pode morrer de SIGPIPE, fazendo o pipeline retornar != 0.

            # Instala na primeira vez, faz upgrade nas seguintes.
            # upgrade.php num banco vazio falha, entao o estado precisa ser
            # detectado antes. A checagem vai direto no MariaDB porque carregar
            # o config.php do Moodle sem a tabela "config" tambem quebra.
            # NAO REMOVA o "< /dev/null" dos "docker compose exec" abaixo.
            # O ssh-action entrega este script pelo STDIN do bash. "exec -T" le
            # o stdin ate EOF, entao engole o resto do proprio script: o bash
            # chega em EOF e encerra em silencio, sem mensagem de erro.
            # Foi exatamente isso que matou o deploy logo apos "docker compose ps".
            DBROOT=$(cat .devcontainer/secrets/db_root_password)
            if docker compose exec -T db mariadb -u root -p"$DBROOT" \
                 -e "SELECT 1 FROM \`${{ vars.MOODLE_DBNAME }}\`.mdl_config LIMIT 1" \
                 </dev/null >/dev/null 2>&1; then
              echo ">> Moodle ja instalado - rodando upgrade"
              docker compose exec -T moodle php admin/cli/upgrade.php --non-interactive </dev/null
            else
              echo ">> Banco vazio - primeira instalacao"
              docker compose exec -T moodle php admin/cli/install_database.php \
                --agree-license \
                --adminuser=admin \
                --adminpass='${{ secrets.MOODLE_ADMIN_PASS }}' \
                --adminemail='leonardodg@msn.com' \
                --fullname="Courses Free" \
                --shortname="courses-free" </dev/null
            fi

            docker compose exec -T moodle php admin/cli/purge_caches.php </dev/null

            # --- nginx -------------------------------------------------------
            # Instala a config do site e o snippet de IP real da Cloudflare.
            #
            # Vem DEPOIS do compose de proposito: o server block faz proxy para
            # o container, entao recarregar o nginx antes dele existir deixaria
            # uma janela de 502.
            #
            # A sequencia e conservadora porque o nginx desta VPS serve outros
            # 15 sites: guarda o estado anterior, testa, e so recarrega se
            # passar. Se nao passar, restaura e falha o deploy - um "nginx -t"
            # quebrado impede o reload de QUALQUER site, nao so deste.
            NGINX_SITE=/etc/nginx/sites-available/courses.leodg.dev.conf
            NGINX_SNIP=/etc/nginx/snippets/cloudflare-realip.conf
            BACKUP=$(mktemp -d)

            sudo -n mkdir -p /etc/nginx/snippets
            for f in "$NGINX_SITE" "$NGINX_SNIP"; do
              [ -f "$f" ] && sudo -n cp "$f" "$BACKUP/$(basename "$f")" || true
            done

            sudo -n cp .devcontainer/nginx/courses.leodg.dev.conf "$NGINX_SITE"
            sudo -n cp .devcontainer/nginx/cloudflare-realip.conf "$NGINX_SNIP"
            sudo -n ln -sfn "$NGINX_SITE" /etc/nginx/sites-enabled/courses.leodg.dev.conf

            if sudo -n nginx -t 2>&1; then
              sudo -n systemctl reload nginx
              echo ">> nginx recarregado"
            else
              echo "::error::nginx -t falhou; restaurando a config anterior"
              for f in "$NGINX_SITE" "$NGINX_SNIP"; do
                [ -f "$BACKUP/$(basename "$f")" ] && sudo -n cp "$BACKUP/$(basename "$f")" "$f" || true
              done
              sudo -n nginx -t && sudo -n systemctl reload nginx
              rm -rf "$BACKUP"
              exit 1
            fi
            rm -rf "$BACKUP"

      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' -L "${{ vars.MOODLE_URL }}/login/index.php" || echo 000)
            echo "tentativa $i: HTTP $CODE"
            [ "$CODE" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::Site nao respondeu 200 em ${{ vars.MOODLE_URL }}"
          exit 1
