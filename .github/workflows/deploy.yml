name: CI/CD - courses.leodg.dev

# =============================================================================
# Ambiente unico (development) na VPS Oracle. Sem GCP, sem AWS.
#
#   pull_request  -> so valida
#   push em main  -> valida, publica a imagem e faz deploy
#
# -----------------------------------------------------------------------------
# BOOTSTRAP: automatico. O job de deploy detecta se a tabela mdl_config existe;
# se nao existir roda install_database.php com o secret MOODLE_ADMIN_PASS, e nos
# deploys seguintes roda so o upgrade.
#
# Secrets e variables vivem no ENVIRONMENT "development", nao no repositorio.
# Por isso todo job que le vars.*/secrets.* declara `environment: development`.
# =============================================================================

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  # Um deploy por vez: dois rodando juntos corrompem o upgrade.php.
  group: deploy-courses-free
  cancel-in-progress: false

# IMAGE NAO pode ser definido aqui: vars.* do environment "development" nao sao
# visiveis no nivel do workflow, e sairia "/courses-free:development".
# Cada job que precisa dele declara environment + env proprio.

jobs:
  # ===========================================================================
  validate:
    name: Validar plugins proprios
    runs-on: ubuntu-latest

    # moodle-plugin-ci instala um Moodle de verdade para rodar os testes,
    # entao precisa de um banco no runner.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          path: plugins-src

      - name: Ler .github/moodle-plugins.txt
        id: plugins
        working-directory: plugins-src
        run: |
          # Ignora comentarios e linhas vazias.
          LIST=$(grep -vE '^\s*(#|$)' .github/moodle-plugins.txt || true)
          if [ -z "$LIST" ]; then
            echo "Nenhum plugin proprio listado ainda - nada a validar."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "$LIST"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "list<<EOF" >> "$GITHUB_OUTPUT"
            echo "$LIST" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Conferir que cada path listado existe e tem version.php
        if: steps.plugins.outputs.found == 'true'
        working-directory: plugins-src
        run: |
          FAIL=0
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            if [ ! -f "$p/version.php" ]; then
              echo "::error::$p nao tem version.php"
              FAIL=1
            fi
          done <<< "${{ steps.plugins.outputs.list }}"
          exit $FAIL

      - uses: shivammathur/setup-php@v2
        if: steps.plugins.outputs.found == 'true'
        with:
          php-version: '8.4'
          extensions: mbstring, pgsql, mysqli, gd, zip, intl, soap, xmlrpc
          ini-values: max_input_vars=5000
          coverage: none

      - name: moodle-plugin-ci
        if: steps.plugins.outputs.found == 'true'
        env:
          # Tem que acompanhar a branch do repo.
          MOODLE_BRANCH: MOODLE_502_STABLE
          DB: pgsql
        run: |
          set -euo pipefail
          composer create-project -n --no-dev --prefer-dist \
            moodlehq/moodle-plugin-ci /tmp/ci ^4
          export PATH="/tmp/ci/bin:/tmp/ci/vendor/bin:$PATH"

          # install monta um Moodle limpo por plugin; por isso o loop refaz
          # a instalacao a cada um, em diretorio proprio.
          i=0
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            i=$((i+1))
            echo "::group::$p"
            rm -rf "/tmp/moodle-$i"
            moodle-plugin-ci install \
              --plugin "$GITHUB_WORKSPACE/plugins-src/$p" \
              --db-host 127.0.0.1 \
              --moodle "/tmp/moodle-$i"
            moodle-plugin-ci phplint
            moodle-plugin-ci phpcs --max-warnings 0
            moodle-plugin-ci phpunit
            echo "::endgroup::"
          done <<< "${{ steps.plugins.outputs.list }}"

  # ===========================================================================
  image:
    name: Build e push da imagem (arm64)
    needs: validate
    if: github.event_name != 'pull_request'
    # A VPS Oracle e aarch64 (Ampere). Buildar na ubuntu-latest, que e x86_64,
    # geraria uma imagem que nao roda la. Runner ARM nativo evita a emulacao
    # QEMU, que num build de Moodle custa dezenas de minutos.
    # Gratuito porque o repositorio e publico.
    runs-on: ubuntu-24.04-arm
    # Obrigatorio: DOCKER_USERNAME e DOCKER_TOKEN vivem no environment.
    environment: development
    env:
      IMAGE: ${{ vars.DOCKER_USERNAME }}/courses-free:development
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/build/moodle.Dockerfile
          target: development
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}
            ${{ vars.DOCKER_USERNAME }}/courses-free:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}
          cache-to: type=inline
          build-args: |
            ENVIRONMENT=development
            TZ=America/Sao_Paulo

  # ===========================================================================
  deploy:
    name: Deploy na VPS Oracle
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: development
    env:
      IMAGE: ${{ vars.DOCKER_USERNAME }}/courses-free:development
    steps:
      - uses: actions/checkout@v4

      # O dev.yml monta o repo do host em /var/www/html, entao o codigo precisa
      # estar no filesystem da VPS - nao basta a imagem.
      - name: Enviar o codigo
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
          SOURCE: "./"
          TARGET: ${{ vars.VPS_PATH }}/repo
          # --delete para arquivo removido no git sumir la tambem.
          # Os excludes protegem o que e gerado/local NA VPS.
          ARGS: "-rlgoDzvc --delete"
          EXCLUDE: ".git/, .github/, node_modules/, .devcontainer/secrets/, .devcontainer/certs/, .env, config.php"

      - name: Configurar e subir
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          envs: IMAGE
          script: |
            set -euo pipefail
            cd "${{ vars.VPS_PATH }}/repo"

            mkdir -p .devcontainer/secrets .devcontainer/certs
            mkdir -p "${{ vars.VPS_PATH }}/moodledata" "${{ vars.VPS_PATH }}/dbdata"

            # --- secrets (0600, nunca versionados) ---
            umask 077
            printf '%s' '${{ secrets.MOODLE_DBUSER }}' > .devcontainer/secrets/db_user
            printf '%s' '${{ secrets.MOODLE_DBPASS }}' > .devcontainer/secrets/db_password
            printf '%s' '${{ secrets.MOODLE_DBROOT }}' > .devcontainer/secrets/db_root_password
            umask 022

            # --- env do container ---
            cat > .devcontainer/env/db.env <<EOF
            MARIADB_DATABASE=${{ vars.MOODLE_DBNAME }}
            EOF

            cat > .devcontainer/env/dev.env <<EOF
            MOODLE_DOCKER_WWWROOT=/var/www/html
            APACHE_DOCUMENT_ROOT=/var/www/html/public
            MOODLE_DATA=/var/www/moodledata
            MOODLE_ADMIN=admin
            MOODLE_DBTYPE=mariadb
            MOODLE_DBLIB=native
            MOODLE_DBHOST=db
            MOODLE_DBNAME=${{ vars.MOODLE_DBNAME }}
            MOODLE_DBPFX=mdl_
            MOODLE_DBCOLLATION=utf8mb4_bin
            MOODLE_URL=${{ vars.MOODLE_URL }}
            MOODLE_DEBUG=DEVELOPER
            MOODLE_DEBUG_DISPLAY=0
            PHP_OPCACHE_VALIDATE_TIMESTAMPS=1
            CRON_ENABLED=true
            EOF

            # --- interpolacao do compose (bind mounts e portas) ---
            cat > .env <<EOF
            MOODLE_HOST_WWWROOT=${{ vars.VPS_PATH }}/repo
            MOODLE_HOST_DATA=${{ vars.VPS_PATH }}/moodledata
            DB_HOST_DATA=${{ vars.VPS_PATH }}/dbdata
            MOODLE_DOCKER_WWWROOT=/var/www/html
            MOODLE_DOCKER_DATA=/var/www/moodledata
            APACHE_DOCUMENT_ROOT=/var/www/html/public
            MOODLE_IMAGE=${IMAGE}
            # 8080/8081/8082 ja estao ocupadas nesta VPS por outros servicos.
            MOODLE_HTTP_PORT=8095
            MOODLE_HTTPS_PORT=8443
            DB_PORT=3307
            XDEBUG_PORT=9004
            # So o nginx local alcanca o container; nada exposto na internet.
            BIND_ADDR=127.0.0.1
            MOODLE_DBNAME=${{ vars.MOODLE_DBNAME }}
            EOF

            # O bind mount esconde o config.php da imagem: ele tem que existir aqui.
            cp .devcontainer/config/config-docker.php config.php

            # Certificado do CONTAINER.
            # Quem termina TLS aqui e o nginx, com o cert Let's Encrypt; o
            # container so serve HTTP na porta interna. Mas base.yml declara
            # ssl_cert/ssl_key como secrets, e o compose nao permite secret
            # opcional nem remover secret por override (o merge e aditivo).
            # Sem os arquivos o docker falha o bind antes do container nascer.
            # Por isso geramos um par descartavel: ele nunca e apresentado a
            # ninguem, so satisfaz o mount.
            if [ ! -f .devcontainer/certs/develop-local.crt ]; then
              openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
                -keyout .devcontainer/certs/develop-local.key \
                -out    .devcontainer/certs/develop-local.crt \
                -subj "/CN=courses-free-internal" 2>/dev/null
              chmod 644 .devcontainer/certs/develop-local.crt
              chmod 600 .devcontainer/certs/develop-local.key
              echo ">> cert interno do container gerado"
            fi

            # --- subir ---
            # build-dev.yml NAO entra: na VPS a imagem vem do Docker Hub.
            export COMPOSE_FILE=.devcontainer/compose/base.yml:.devcontainer/compose/db.yml:.devcontainer/compose/dev.yml
            export COMPOSE_ENV_FILE=.env

            docker compose pull
            docker compose up -d --remove-orphans
            docker compose ps

            # Espera o banco ficar saudavel antes de mexer no schema.
            for i in $(seq 1 30); do
              if docker compose ps db | grep -q healthy; then break; fi
              sleep 5
            done

            # Instala na primeira vez, faz upgrade nas seguintes.
            # upgrade.php num banco vazio falha, entao o estado precisa ser
            # detectado antes. A checagem vai direto no MariaDB porque carregar
            # o config.php do Moodle sem a tabela "config" tambem quebra.
            DBROOT=$(cat .devcontainer/secrets/db_root_password)
            if docker compose exec -T db mariadb -u root -p"$DBROOT" \
                 -e "SELECT 1 FROM \`${{ vars.MOODLE_DBNAME }}\`.mdl_config LIMIT 1" \
                 >/dev/null 2>&1; then
              echo ">> Moodle ja instalado - rodando upgrade"
              docker compose exec -T moodle php admin/cli/upgrade.php --non-interactive
            else
              echo ">> Banco vazio - primeira instalacao"
              docker compose exec -T moodle php admin/cli/install_database.php \
                --agree-license \
                --adminuser=admin \
                --adminpass='${{ secrets.MOODLE_ADMIN_PASS }}' \
                --adminemail='leonardodg@msn.com' \
                --fullname="Courses Free" \
                --shortname="courses-free"
            fi

            docker compose exec -T moodle php admin/cli/purge_caches.php

      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' -L "${{ vars.MOODLE_URL }}/login/index.php" || echo 000)
            echo "tentativa $i: HTTP $CODE"
            [ "$CODE" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::Site nao respondeu 200 em ${{ vars.MOODLE_URL }}"
          exit 1
