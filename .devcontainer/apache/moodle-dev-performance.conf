# MPM dimensionado para a VPS Oracle (23 GiB, compartilhada com outros servicos).
#
# O valor anterior era MaxRequestWorkers 6, herdado de uma maquina bem menor.
# Seis requisicoes simultaneas saturam com pouquissimos alunos, e o sintoma no
# log e "AH00161: server reached MaxRequestWorkers setting" - que ja apareceu.
#
# Regra de dimensionamento: cada processo PHP do Moodle consome de 64 a 96 MB
# sob carga. Com o limite de 2G do container, 20 workers deixam folga para o
# Apache, o opcache e picos pontuais.
#
# IMPORTANTE: max_connections do MariaDB precisa ser MAIOR que este numero,
# somado ao cron e ao CLI. Ver config/mysql-dev.cnf (hoje: 100).
<IfModule mpm_prefork_module>
    StartServers           4
    MinSpareServers        2
    MaxSpareServers        8
    MaxRequestWorkers      20
    # Recicla o processo periodicamente: limita o efeito de vazamento de
    # memoria em requisicao longa, como restore de backup.
    MaxConnectionsPerChild 1000
</IfModule>

# Compressao economiza banda, que na Oracle e cobrada por trafego de saida.
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json text/plain text/xml image/svg+xml
</IfModule>
